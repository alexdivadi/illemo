name: illemo
description: A emotion tracking wellness app.

publish_to: 'none'
version: 2.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.8.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  firebase_core: ^4.13.0
  firebase_remote_config: ^6.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: 3.3.2
  flutter_timezone: ^5.1.0
  force_update_helper: ^0.3.0
  go_router: ^17.5.0
  intl: ^0.20.2
  riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  shared_preferences: ^2.3.3
  sqflite: ^2.4.2
  timezone: ^0.11.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  # a tool for running code generators
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # the code generator
  # 4.0.6+ requires analyzer 13, which conflicts with this Flutter SDK's flutter_test pins.
  riverpod_generator: 4.0.4
  sqflite_common_ffi: ^2.3.7+1

flutter:
  uses-material-design: true
  assets:
    - assets/common/
    - path: assets/dev/
      flavors:
        - dev
    - path: assets/prod/
      flavors:
        - production
